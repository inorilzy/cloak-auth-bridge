[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak-auth-bridge"
version = "0.2.0"
description = "Local Chrome-to-CloakBrowser authentication bridge with MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cloakbrowser>=0.5.6,<0.6",
  "mcp>=1.0,<2",
  "pydantic>=2.10,<3",
  "pywin32>=308; sys_platform == 'win32'",
  "websockets>=14,<17"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1"
]

[project.scripts]
cloak-auth-bridge = "cloak_auth_bridge.main:main"
cloak-auth-bridge-mcp = "cloak_auth_bridge.main:main"

[project.urls]
Homepage = "https://github.com/inorilzy/cloak-auth-bridge"
Repository = "https://github.com/inorilzy/cloak-auth-bridge"

[tool.setuptools.packages.find]
include = ["cloak_auth_bridge*"]

[tool.setuptools.package-data]
cloak_auth_bridge = [
  "defaults/profiles.json",
  "defaults/sites/*.json",
  "defaults/extension/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = [".venv"]

[tool.ruff]
line-length = 110
target-version = "py312"


[tool.ruff.lint.per-file-ignores]
# CDP attach paths intentionally swallow non-fatal protocol errors.
"cloak_auth_bridge/reverse_session.py" = ["S110", "S112", "BLE001"]
"cloak_auth_bridge/mcp_server.py" = ["S110", "BLE001"]
