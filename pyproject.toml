[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak-auth-bridge"
version = "0.1.0"
description = "Local Chrome-to-CloakBrowser authentication bridge with MCP tools"
requires-python = ">=3.11"
dependencies = [
  "cloakbrowser>=0.5.6,<0.6",
  "mcp>=1.0,<2",
  "pydantic>=2.10,<3",
  "pywin32>=308; sys_platform == 'win32'",
  "websockets>=14,<17"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1"
]

[project.scripts]
cloak-auth-bridge = "cloak_auth_bridge.main:main"

[tool.setuptools.packages.find]
include = ["cloak_auth_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = [".venv"]

[tool.ruff]
line-length = 110
target-version = "py312"
